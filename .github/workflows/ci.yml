name: CI

on:
  push:
  pull_request:

jobs:
  fe:
    name: Fe checks, tests, build, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe 26.6.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version v26.6.0 --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: fe --version
      - name: Format check
        run: fe fmt --check
      - name: Tests
        run: fe test
      - name: Build
        run: fe build
      - name: Vector generators match committed files
        run: |
          pip install pycryptodome 'eth-hash[pycryptodome]'
          python3 tools/gen_merkle_vectors.py
          python3 tools/gen_fixed_vectors.py
          fe fmt
          git diff --exit-code src/gen_merkle_tests.fe src/gen_fixed_tests.fe vectors/

  bench:
    name: Forge gas benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe 26.6.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version v26.6.0 --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build Fe artifacts
        run: fe build
      - name: Generate benchmark test
        run: |
          pip install pycryptodome 'eth-hash[pycryptodome]'
          python3 tools/gen_bench.py
      - name: Install Forge dependencies
        working-directory: bench
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts
      - name: Run benchmarks
        working-directory: bench
        run: forge test -vvv
